# Archivo       : android/gradle.properties
# Proyecto      : SOSMASCOTA
# Autores       : David Anampa, Danilo Chite
# Fecha         : 13/11/2026
# Descripción   : Propiedades de la JVM de Gradle y banderas de compatibilidad AndroidX/Jetifier.
# Se vincula con: Motor Gradle de Android (android/build.gradle.kts y android/app/build.gradle.kts).

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true
