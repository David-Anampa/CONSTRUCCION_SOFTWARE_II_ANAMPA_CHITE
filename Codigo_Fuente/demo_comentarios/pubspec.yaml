name: demo_comentarios
description: "Demo independiente del módulo de comentarios — SOS Mascota"

# Este proyecto no se publica en pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase: autenticación, base de datos y almacenamiento
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1

  # Notificaciones push (misma lógica que el proyecto principal)
  firebase_messaging: ^16.0.3
  googleapis_auth: ^2.0.0

  # Selección de imágenes desde galería
  image_picker: ^1.2.0

  # Notificaciones locales
  flutter_local_notifications: ^19.4.2

  # Utilidades
  cupertino_icons: ^1.0.8
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Clave de cuenta de servicio para envío de notificaciones FCM
  assets:
    - assets/keys/service_account.json
