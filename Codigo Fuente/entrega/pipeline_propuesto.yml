# PROPUESTA - NO ACTIVAR (no está en .github/workflows). Borrador para SOS Mascota.
# Flujo Anexo D: Commit -> Build -> Pruebas -> Calidad -> Deploy QA -> STAGING -> PROD
# Secretos necesarios (solo nombres): FIREBASE_SERVICE_ACCOUNT, FIREBASE_APP_ID_QA,
#   FIREBASE_APP_ID_STAGING, GOOGLE_SERVICES_JSON_QA/_STG/_PROD (base64), KEYSTORE_BASE64,
#   KEY_PROPERTIES, PLAY_SERVICE_ACCOUNT_JSON, SONAR_TOKEN, SONAR_HOST_URL
# Requiere (RECOMENDACIÓN): flavors qa/staging/prod y proyectos Firebase separados.
name: CI-CD-SOSMascota (PROPUESTA)

on:
  push:
    branches: [develop, "release/**", main]
  pull_request:
    branches: [develop, main]

env:
  FLUTTER_VERSION: "3.35.6"   # versión verificada localmente
  JAVA_VERSION: "17"

jobs:
  build-test:
    name: Build + Pruebas + Calidad
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Código Fuente"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --coverage
      - name: SonarQube (opcional)
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Restaurar google-services (QA)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_QA }}" | base64 -d > android/app/google-services.json
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: apk-qa, path: "Código Fuente/build/app/outputs/flutter-apk/app-release.apk" }

  deploy-qa:
    name: Deploy QA (Firebase App Distribution)
    needs: build-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk-qa }
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_QA }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers-qa
          file: app-release.apk

  deploy-staging:
    name: Deploy STAGING (AAB -> Play Console track interno)
    needs: build-test
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: "Código Fuente"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - run: echo "${{ secrets.GOOGLE_SERVICES_JSON_STG }}" | base64 -d > android/app/google-services.json
      - run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.jks
      - run: echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
      - run: flutter build appbundle --release
      - name: Publicar reglas/índices Firestore (STAGING)
        run: npx -y firebase-tools deploy --only firestore:rules,firestore:indexes --project <ID_PROYECTO_STAGING>
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  deploy-prod:
    name: Deploy PROD (aprobación manual)
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # configurar "Required reviewers" = puerta de aprobación manual
    steps:
      - run: echo "Publicar AAB firmado en Play Console (track producción, rollout escalonado 10%->50%->100%)"
      # RECOMENDACIÓN: usar r0adkll/upload-google-play con PLAY_SERVICE_ACCOUNT_JSON
